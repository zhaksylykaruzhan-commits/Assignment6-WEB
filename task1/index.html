<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector Detective - who took the cake?</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Who took the cake?</h1>
    <p>A birthday party at the AITU house, 19:30 – 22:30. At 21:30 the cake vanished from the kitchen. Pick a case and let jQuery search the page.</p>
  </header>

  <nav id="cases" class="cases" aria-label="Cases"></nav>

  <section id="result" class="result" aria-live="polite">
    <div class="result-case">Pick a case</div>
    <div class="result-q">Every button runs one jQuery chain on the rebuilt page.</div>
    <div class="result-a"></div>
  </section>

  <main class="house">
    <div class="roof"><div class="chimney"></div><div class="sign">The Party, 19:30 – 22:30</div></div>
    <div id="floors" class="floors"></div>
  </main>

  <footer id="legend" class="legend"></footer>

  <script src="lib/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/cases.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
